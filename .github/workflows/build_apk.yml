name: Build Noor Store APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon -x test -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoorStore-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Extract App Version
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Noor Store App v${{ env.APP_VERSION }}"
          body: "Noor Store App v${{ env.APP_VERSION }} Official Release - ئەڭ يېڭى نۇسخا: تاق تۈر ھالەتكە كەلتۈرۈلدى ۋە نەشىر كاشىلىلىرى تۈزىتىلدى."
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

